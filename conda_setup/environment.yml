# The fork's own tools, beside the vsnp3 env and never inside it.
# mafft aligns VP1 sequences for bin/fmdv_vp1_tree.py; the tree itself uses
# raxmlHPC from the vsnp3 env when it is on PATH, else iqtree2 from here.
# blast (blastn, makeblastdb) is for bin/fmdv_vp1_context.py.
#   mamba env create -f conda_setup/environment.yml
#   export PATH=$HOME/miniforge3/envs/fmdv_gui/bin:$PATH
name: fmdv_gui
channels:
  - conda-forge
  - bioconda
dependencies:
  - mafft
  - iqtree
  - seqkit
  - blast
