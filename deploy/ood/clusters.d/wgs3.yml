---
v2:
  metadata:
    title: "WGS3 (Local)"
  login:
    host: "localhost"
  job:
    adapter: "linux_host"
    submit_host: "localhost"
    ssh_hosts:
      - localhost
      - a8-an-vxk1-u5
      - kapurlab-wgs3.tailf38ff4.ts.net
    site_timeout: 7200
    debug: true
    singularity_bin: /usr/bin/singularity
    # /etc/resolv.conf on the host is a symlink to /run/systemd/resolve/
    # stub-resolv.conf (pointing at the 127.0.0.53 systemd-resolved stub).
    # Without /run/systemd/resolve mounted, the symlink dangles inside the
    # container and DNS silently fails — every in-container process trying
    # to reach eutils.ncbi.nlm.nih.gov / ENA / S3 / etc. hits "Temporary
    # failure in name resolution". Binding the directory makes the symlink
    # resolve; 127.0.0.53 is reachable because Singularity shares the
    # host's network namespace by default. Verified eutils returns 200
    # from inside the container with this bind in place.
    # (A file-to-file bind onto /etc/resolv.conf was tried first and
    # rejected by Singularity — the destination must already exist as a
    # regular file inside the image, which it doesn't.)
    singularity_bindpath: /etc,/home,/tmp,/opt,/usr,/var,/srv,/run/systemd/resolve
    singularity_image: /opt/ood/ondemand/ood_default.sif
    strict_host_checking: false
    tmux_bin: /usr/bin/tmux
