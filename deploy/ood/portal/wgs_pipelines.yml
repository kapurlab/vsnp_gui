# T-16 — KapurLab landing page declarative config.
#
# Read by deploy/ood/portal/apps/dashboard/views/dashboard/index.html.erb
# (the override partial). Install at /etc/ood/config/wgs_pipelines.yml.
#
# Phase 3 (live) replaced the mocked `jobs:`, `system:`, and `data:` blocks
# this file used to carry. Active sessions, system metrics (cpu/mem/storage),
# and the data lists are now read directly inside the partial from
# BatchConnect::Session / /proc / df / filesystem walks. What remains here
# is genuinely declarative: pipeline cards, footer copy, onboarding links.

pipelines:
  # First on purpose: the consolidated dashboard is the recommended front door
  # — one authenticated session for the whole suite, every tool on one page.
  # The per-tool cards below remain for dedicated single-tool sessions.
  - id: bdtools_dashboard
    icon: b
    title: Diagnostic Tools Dashboard
    description: >-
      Every tool in one place. Allocates one session for the whole suite and
      launches each tool on it behind a single authenticated proxy — the
      recommended way to open the tools.
    status: available
    runtime: "one session, all tools"
    launch_url: /pun/sys/dashboard/batch_connect/sys/bdtools_dashboard/session_contexts/new

  - id: vsnp3
    icon: v
    title: vSNP3
    description: >-
      Validated reference-guided SNP analysis and phylogenetics pipeline.
      Supports bacterial and viral pathogens WGS analysis for outbreak
      tracking and isolate clustering.
    status: available
    runtime: "GUI-based interactive fully contained sessions"
    launch_url: /pun/sys/dashboard/batch_connect/sys/vsnp_gui/session_contexts/new

  - id: desktop
    icon: D
    title: Desktop Session
    description: >-
      Graphical desktop with the lab bioinformatics toolchain pre-installed.
      For ad-hoc analysis and visualization.
    status: coming
    runtime: "in development"

  - id: kraken
    icon: k
    title: Kraken
    description: >-
      Read-level taxonomic classification against custom databases. For
      contamination screening and metagenomic profiling.
    status: available
    runtime: "GUI-based interactive fully contained sessions"
    launch_url: /pun/sys/dashboard/batch_connect/sys/kraken_id_parse_gui/session_contexts/new

  - id: ncbi_submit
    icon: N
    title: NCBI Submit
    description: >-
      Prepare and submit SRA (FASTQ) and GenBank (FASTA) deposits to NCBI from
      an Excel metadata sheet. Validates to ISO/INSDC standards, deduplicates
      against records already in NCBI, and links BioSamples across archives.
    status: available
    runtime: "GUI-based interactive fully contained sessions"
    launch_url: /pun/sys/dashboard/batch_connect/sys/ncbi_submit_gui/session_contexts/new

  - id: ksnp
    icon: S
    title: kSNP4
    description: >-
      Reference-free, alignment-free SNP discovery and phylogenetics from
      genome FASTAs. Builds parsimony / ML / NJ SNP trees and core-SNP
      matrices for outbreak clustering, with a QC + provenance PDF report.
    status: available
    runtime: "GUI-based interactive fully contained sessions"
    launch_url: /pun/sys/dashboard/batch_connect/sys/ksnp_gui/session_contexts/new

  - id: amr
    icon: A
    title: AMRFinderPlus
    description: >-
      Antimicrobial resistance, virulence & stress-gene detection with
      conservative organism resolution. NCBI AMRFinderPlus with QC and
      provenance, plus PDF and Excel reports.
    status: available
    runtime: "GUI-based interactive fully contained sessions"
    launch_url: /pun/sys/dashboard/batch_connect/sys/amr_plus_gui/session_contexts/new

  - id: mlst
    icon: M
    title: MLST
    description: >-
      Multi-locus sequence typing — autodetects the PubMLST scheme and reports
      the sequence type (ST) for WGS isolates.
    status: available
    runtime: "GUI-based interactive fully contained sessions"
    launch_url: /pun/sys/dashboard/batch_connect/sys/mlst_gui/session_contexts/new

  - id: genoflu
    icon: G
    title: GenoFLU
    description: >-
      Influenza A whole-genome genotyping (incl. H5N1 2.3.4.4b) by per-segment
      BLAST — the USDA-VS GenoFLU method.
    status: available
    runtime: "GUI-based interactive fully contained sessions"
    launch_url: /pun/sys/dashboard/batch_connect/sys/genoflu_gui/session_contexts/new

  - id: irma
    icon: I
    title: IRMA
    description: >-
      Influenza / SARS-CoV-2 genome assembly (CDC IRMA) with a metadata-built
      submission FASTA and GenoFLU genotyping.
    status: available
    runtime: "GUI-based interactive fully contained sessions"
    launch_url: /pun/sys/dashboard/batch_connect/sys/irma_gui/session_contexts/new

  - id: mhc
    icon: m
    title: MHC Typer
    description: >-
      BoLA typing from WGS reads. Optimized for bovine reference panels.
    status: available
    runtime: "GUI-based interactive sessions (dev/beta)"
    launch_url: /pun/sys/dashboard/batch_connect/sys/mhc_gui/session_contexts/new

footer:
