# T-16 Phase 2 — KapurLab landing page mock data.
#
# Read by deploy/ood/portal/apps/dashboard/views/dashboard/index.html.erb
# (the override partial). Phase 2 sources every section from this file so
# the partial stays declarative; Phase 3 swaps the static `jobs:` and
# `system:` blocks for live JobManager / df / /proc/loadavg readers and
# walks /srv/kapurlab/projects + /home/<user>/projects for `data:`.
#
# Install at /etc/ood/config/wgs_pipelines.yml on wgs3.

pipelines:
  - id: vsnp3
    icon: v
    title: vSNP3
    description: >-
      Reference-guided SNP analysis and phylogenetics. Supports MTBC,
      <em>Brucella</em>, and other bacterial pathogens for outbreak tracking
      and isolate clustering.
    status: available
    runtime: "~30 min · 8 cores"
    launch_url: /pun/sys/dashboard/batch_connect/sys/vsnp_gui/session_contexts/new

  - id: desktop
    icon: D
    title: Desktop Session
    description: >-
      Graphical desktop with the lab bioinformatics toolchain pre-installed.
      For ad-hoc analysis and visualization.
    status: available
    runtime: "interactive · 4 cores"
    launch_url: /pun/sys/dashboard/batch_connect/sys/bc_desktop/session_contexts/new

  - id: kraken
    icon: k
    title: Kraken Classifier
    description: >-
      Read-level taxonomic classification against custom databases. For
      contamination screening and metagenomic profiling.
    status: coming
    runtime: "in development"

  - id: mhc
    icon: m
    title: MHC Typer
    description: >-
      HLA and BoLA typing from WGS reads. Optimized for bovine and human
      reference panels.
    status: coming
    runtime: "in development"

# Phase 2 mock — Phase 3 replaces with live JobManager output.
jobs:
  - name: "vSNP3 · btb_india_batch_07"
    meta: "4 isolates · M. bovis · started 23m ago · vivek"
    status: running
    runtime: "23m"
  - name: "vSNP3 · brucella_screen_q3"
    meta: "8 isolates · B. melitensis · started 8m ago · raksha"
    status: running
    runtime: "8m"

# Phase 2 mock — Phase 3 walks /srv/kapurlab/projects and /home/<user>/.
data:
  shared:
    - label: Reference
      path: /srv/kapurlab/refs/vsnp3/reference_options
      info: "12 references · 2.4 GB"
    - label: "Project · Sanity Test"
      path: /srv/kapurlab/projects/sanity_test
      info: "MTBC SARS-CoV-2 deer · smoke test"
  personal:
    - label: Home
      path: /home/$USER
      info: "per-user projects + uploads"
    - label: "Uploads (incoming)"
      path: /home/$USER/uploads
      info: "drop dir for staged ingest"

